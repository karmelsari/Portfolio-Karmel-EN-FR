<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karmel Sari — Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#faf9f6}
.language-bar{position:fixed;top:0;left:0;right:0;z-index:99999;height:58px;display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:10px 24px;background:rgba(250,249,246,.98);border-bottom:1px solid #e4e2dc}
.language-bar button{min-width:58px;padding:8px 16px;border:1px solid #b5672a;border-radius:4px;background:#fff;color:#1a1a18;font:600 13px Helvetica,Arial,sans-serif;cursor:pointer}
.language-bar button:hover,.language-bar button.active{background:#b5672a;color:#fff}
#portfolioFrame{display:block;width:100%;height:calc(100vh - 58px);margin-top:58px;border:0}
@media(max-width:600px){.language-bar{height:52px;padding:8px 14px}#portfolioFrame{height:calc(100vh - 52px);margin-top:52px}}
</style>
</head>
<body>
<div class="language-bar">
  <button id="enBtn" onclick="showPortfolio('EN')">EN</button>
  <button id="frBtn" class="active" onclick="showPortfolio('FR')">FR</button>
</div>
<iframe id="portfolioFrame" title="Karmel Sari Portfolio"></iframe>
<script>
const portfolios={EN:'index-EN.html',FR:'index-FR.html'};
function showPortfolio(lang){
  document.getElementById('portfolioFrame').src=portfolios[lang];
  document.documentElement.lang=lang==='FR'?'fr':'en';
  document.getElementById('enBtn').classList.toggle('active',lang==='EN');
  document.getElementById('frBtn').classList.toggle('active',lang==='FR');
}
showPortfolio('FR');
</script>
</body>
</html>
